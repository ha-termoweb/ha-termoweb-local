name: Schedule card bundle

on:
  push:
    branches: [main]
    paths:
      - "custom_components/termoweb_local/frontend/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "custom_components/termoweb_local/frontend/**"
      - ".github/workflows/frontend.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  es5-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Rebuild the es5 bundle
        run: bash custom_components/termoweb_local/frontend/build-es5.sh

      - name: The committed bundle must match a fresh build
        run: |
          if ! git diff --exit-code -- custom_components/termoweb_local/frontend/; then
            echo "::error::termoweb-local-schedule-card.es5.js is stale: run frontend/build-es5.sh and commit the result"
            exit 1
          fi
