name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Tag must match manifest.json and pyproject.toml
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest=$(python3 -c 'import json; print(json.load(open("custom_components/termoweb_local/manifest.json"))["version"])')
          project=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')
          echo "tag=$tag manifest=$manifest pyproject=$project"
          if [ "$tag" != "$manifest" ] || [ "$tag" != "$project" ]; then
            echo "::error::tag v$tag does not match manifest.json ($manifest) and pyproject.toml ($project)"
            exit 1
          fi

      - name: Build the firmware
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-avr avr-libc binutils-avr
          make -C firmware/termoweb_rx clean build PA=0xC0
          cp firmware/termoweb_rx/termoweb_rx.hex "termoweb_rx-${GITHUB_REF_NAME}-paC0.hex"

      - name: Package the integration
        run: |
          cd custom_components/termoweb_local
          find . -name __pycache__ -prune -o -type f -print | sort | zip -q -@ "$GITHUB_WORKSPACE/termoweb_local.zip"

      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            termoweb_local.zip
            termoweb_rx-${{ github.ref_name }}-paC0.hex
