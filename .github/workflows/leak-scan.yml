name: Leak scan

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The gitleaks CLI image, not gitleaks-action, which needs a paid
      # licence key on organisation-owned repositories.
      - name: gitleaks over the whole history
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest git /repo --redact --verbose

  private-identifiers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: No private LAN addresses or home paths
        run: |
          pattern='(^|[^0-9.])(192\.168\.[0-9]{1,3}\.[0-9]{1,3}|10\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}|172\.(1[6-9]|2[0-9]|3[01])\.[0-9]{1,3}\.[0-9]{1,3})([^0-9]|$)|/home/[a-z]|/Users/[A-Za-z]'
          if git grep -nIE "$pattern" -- . ':!*.es5.js' ':!.github/workflows/leak-scan.yml'; then
            echo "::error::private address or home path found"
            exit 1
          fi

      # Installation-specific identifiers (device serials, the cloud dev_id,
      # heater identities, hostnames) live in the LEAK_PATTERNS secret, one
      # fixed string per line, so that the list itself is never published.
      - name: No installation-specific identifiers
        env:
          LEAK_PATTERNS: ${{ secrets.LEAK_PATTERNS }}
        run: |
          if [ -z "$LEAK_PATTERNS" ]; then
            echo "::notice::LEAK_PATTERNS secret not set (forks and pull requests from forks get no secrets); skipping"
            exit 0
          fi
          printf '%s\n' "$LEAK_PATTERNS" | sed '/^$/d' > "$RUNNER_TEMP/patterns"
          if git grep -nIiF -f "$RUNNER_TEMP/patterns" -- . > "$RUNNER_TEMP/hits"; then
            echo "::error::$(wc -l < "$RUNNER_TEMP/hits") line(s) match a LEAK_PATTERNS entry (contents withheld)"
            cut -d: -f1,2 "$RUNNER_TEMP/hits"
            exit 1
          fi
