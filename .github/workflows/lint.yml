name: Lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Rules and exclusions come from [tool.ruff] in pyproject.toml.
      - uses: astral-sh/ruff-action@v4
        with:
          args: check
